<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMAPS Runway Monitor</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{--bg:#070b16;--panel:#0e1526;--line:#1d2a44;--txt:#d7e0f2;--dim:#7f8cab;--cyan:#39d0ff;--white:#ffffff;--amber:#ffb13b;--red:#ff3b5c;--green:#3ddc84;--nv:#76b900;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #app{display:grid;grid-template-columns:440px 1fr 340px;grid-template-rows:44px 1fr 54px;height:100%}
  header{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:14px;margin:0;letter-spacing:.08em;font-family:var(--mono)} header .sub{color:var(--dim);font-family:var(--mono);font-size:12px} header .spacer{flex:1}
  #modetag{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.08em}
  #modetag.asis{background:#3a1420;color:var(--red)} #modetag.gmaps{background:#0d2a1a;color:var(--green)}
  #radio,#right{background:var(--panel);overflow:auto;padding:10px;border-right:1px solid var(--line)} #right{border-right:0;border-left:1px solid var(--line)}
  h2{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:2px 0 8px;font-family:var(--mono)}
  /* speakers: one colour each, used everywhere */
  .s-TWR{--sc:var(--cyan)} .s-JAZZ646{--sc:var(--white)} .s-TRUCK1{--sc:var(--amber)}
  .badge{display:inline-block;font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.04em;color:#05080f;background:var(--sc);padding:3px 8px;border-radius:5px;white-space:nowrap}
  .tx{border:1px solid var(--line);border-left:5px solid var(--sc);border-radius:8px;padding:8px 10px;margin-bottom:9px;background:#0b1222;animation:in .25s ease-out}
  .tx .meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:6px}
  .tx .who{font-family:var(--mono);font-size:10.5px;color:var(--sc);margin:-2px 0 6px}
  .io{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;align-items:start}
  .io .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim);margin-bottom:3px}
  .io .in{font-style:italic;font-size:13px;color:#eef2ff} .io .arrow{color:var(--dim);font-size:16px;padding-top:14px;text-align:center}
  .io .out{font-family:var(--mono);font-size:10.5px;color:#cfe8b8;white-space:pre-wrap;word-break:break-word} .io .out.wait{color:var(--dim)}
  .wording{font-family:var(--mono);font-size:10px;color:var(--amber);margin-top:4px}
  .checks{margin-top:6px;font-family:var(--mono);font-size:10.5px;display:flex;flex-wrap:wrap;gap:4px 10px} .ck{color:var(--green)} .cx{color:var(--red)} .cxa{color:var(--amber)}
  .why{margin-top:5px;font-family:var(--mono);font-size:11px;color:#dfe7f7;border-top:1px dashed var(--line);padding-top:5px} .why b{color:var(--sc)}
  .lat{color:var(--nv)}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px} td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} th{color:var(--dim);font-weight:500}
  .ok{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red)}
  #alert{display:none;margin-top:10px;border:1px solid var(--red);background:#2a0d16;border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px}
  #alert.on{display:block;animation:pulse 1s infinite} @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,92,.0)}50%{box-shadow:0 0 0 6px rgba(255,59,92,.25)}}
  #alert .big{font-size:13px;font-weight:700;color:var(--red);margin-bottom:6px} #alert .rwhy{margin-top:8px;padding-top:6px;border-top:1px dashed #5a2030;color:#ffd7de}
  #spark{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-family:var(--mono);font-size:11px;line-height:1.55} #spark b{color:var(--nv)}
  #map{position:relative} #map .maplibregl-ctrl-attrib{font-size:10px}
  #freq{position:absolute;left:10px;right:10px;top:10px;z-index:7;background:rgba(10,16,30,.94);border:1px solid var(--line);border-left:6px solid var(--sc);border-radius:10px;padding:9px 14px;display:none}
  #freq.on{display:block;animation:freqin .35s ease-out} @keyframes freqin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  #freq .top{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--dim)} #freq .top .now{letter-spacing:.16em} #freq .top .clk{margin-left:auto;color:#eef2ff;font-size:13px;font-weight:700}
  #freq .words{font-size:21px;font-weight:600;color:#fff;margin-top:5px;font-style:italic;line-height:1.25} #freq .wd{font-family:var(--mono);font-size:10.5px;color:var(--amber);margin-top:3px}
  #timeline{position:absolute;left:10px;right:10px;bottom:10px;z-index:7;background:rgba(10,16,30,.95);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px}
  #tlbar{position:relative;height:58px;margin:0 26px} #tlbar .axis{position:absolute;left:0;right:0;top:32px;height:3px;background:#2a3a5e;border-radius:2px}
  #tlbar .tick{position:absolute;top:38px;font-family:var(--mono);font-size:9.5px;color:var(--dim);transform:translateX(-50%)}
  #tlbar .mk{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;white-space:nowrap;text-align:center;line-height:1.1}
  #tlbar .mk .sym{font-size:13px;display:block} #tlbar .cursor{position:absolute;top:2px;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px #fff}
  #tlkey{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px;font-family:var(--mono);font-size:9.2px;line-height:1.35;margin-top:2px;color:#cdd6ea} #tlkey .never{color:var(--dim)}
  #tlcap{font-family:var(--mono);font-size:12px;font-weight:700;color:#eafff1;margin-top:5px;padding:5px 8px;border:1px solid var(--green);border-radius:6px;background:rgba(8,60,32,.9);display:none} #tlcap.on{display:block}
  .banner{position:absolute;left:50%;top:132px;transform:translateX(-50%);background:rgba(255,59,92,.92);color:#fff;padding:7px 16px;border-radius:8px;font-family:var(--mono);font-weight:700;letter-spacing:.06em;display:none;z-index:6} .banner.on{display:block}
  #caption{position:absolute;left:50%;bottom:268px;transform:translateX(-50%);width:max-content;max-width:88%;padding:9px 16px;border-radius:10px;font-family:var(--mono);font-weight:700;font-size:14px;line-height:1.45;display:none;z-index:8;text-align:center}
  #caption.red{display:block;background:rgba(120,10,30,.94);border:2px solid var(--red);color:#fff} #caption.green{display:block;background:rgba(8,60,32,.94);border:2px solid var(--green);color:#eafff1}
  #livecap{position:absolute;right:56px;top:132px;z-index:6;font-family:var(--mono);font-size:10.5px;background:rgba(14,21,38,.88);border:1px solid var(--nv);color:var(--nv);padding:4px 8px;border-radius:6px;display:none}
  footer{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-top:1px solid var(--line);font-family:var(--mono);font-size:12px}
  footer input[type=range]{flex:1} footer button{background:#16213a;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:var(--mono)}
  #clock{min-width:330px;color:var(--cyan)} #clock .wall{font-size:22px;font-weight:800;color:#fff;margin-right:12px;letter-spacing:.02em}
  #card{position:fixed;inset:0;z-index:50;background:#05080f;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px;text-align:center;font-family:var(--mono)}
  #card.on{display:flex} #card .c1{font-size:38px;font-weight:700;color:#eef2ff;letter-spacing:.03em} #card .c2{font-size:20px;color:#b7c3dd;max-width:1150px}
  #card table{width:auto;font-size:21px;margin-top:6px} #card td{padding:7px 18px;border-bottom:1px solid #1d2a44;text-align:left} #card td.n{text-align:right;font-weight:700} #card tr.ours td{color:var(--nv)} #card .note{font-size:16px;color:#9fb0cf}
  /* stand-alone views */
  body.view-log #app,body.view-spark #app{display:none}
  #view{display:none;padding:22px 28px;font-family:var(--mono)} body.view-log #view,body.view-spark #view{display:block}
  #view h1{font-size:18px;letter-spacing:.08em;margin:0 0 4px} #view .sub{color:var(--dim);font-size:12px;margin-bottom:16px}
  #view table{font-size:12.5px} #view td{padding:8px 6px;vertical-align:top} #view .dot{display:inline-block;width:12px;height:12px;border-radius:50%}
  .sp-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:22px} .sp-box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel)}
  .sp-big{font-size:30px;font-weight:800;color:var(--nv)} .ep{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px} .ep .l{width:12px;height:12px;border-radius:50%}
  .bars div{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:11.5px} .bars .b{height:12px;border-radius:3px;background:var(--nv)}
</style>
</head>
<body>
<div id="card"></div>
<div id="view"></div>
<div id="app">
  <header>
    <h1>GMAPS · RUNWAY MONITOR</h1><span class="sub" id="hdr">loading…</span><span class="spacer"></span><span id="modetag"></span>
  </header>
  <aside id="radio"><h2>RADIO · INPUT → PARSED OUTPUT (live) · ✓ vs scripted record</h2><div id="txlist"></div></aside>
  <div id="map">
    <div id="freq"><div class="top"><span class="now">NOW ON FREQUENCY</span><span id="freqbadge"></span><span class="clk" id="freqclk"></span></div><div class="words" id="freqwords"></div><div class="wd" id="freqwd"></div></div>
    <div class="banner" id="banner">POSSIBLE CONFLICT</div><div id="livecap"></div><div id="caption"></div>
    <div id="timeline"><div id="tlbar"></div><div id="tlkey"></div><div id="tlcap"></div></div>
  </div>
  <aside id="right">
    <h2>CLEARANCE LEDGER · RWY <span id="rwy"></span></h2>
    <table><thead><tr><th>rwy</th><th>authorization</th><th>who</th><th>status</th></tr></thead><tbody id="statebody"></tbody></table>
    <div id="alert"></div>
    <h2 style="margin-top:12px">LOOK-AHEAD</h2><table id="lookahead"></table>
    <div id="spark"></div>
  </aside>
  <footer>
    <button id="play">▶ play</button><button id="restart">↺</button><span id="clock"></span>
    <input type="range" id="scrub" min="0" max="100" step="0.1" value="0"><span class="sub">© OpenStreetMap contributors · NTSB DCA26MA161 (preliminary)</span>
  </footer>
</div>
<script>
const qs = new URLSearchParams(location.search);
const SCN = qs.get('scenario') || 'scenario_lga_04.json';
const MODE = qs.get('mode') === 'asis' ? 'asis' : 'gmaps';
const VIEW = qs.get('view') || 'monitor';
const LIVE = qs.get('live') === '1';
const CARD_MS = parseFloat(qs.get('cardms') || 3000);
let FREEZE = qs.has('freeze') ? parseFloat(qs.get('freeze')) : null;
let scn, geo, stepped = {}, t = 0, playing = false, speed = parseFloat(qs.get('speed') || 2), last = null, shown = new Set(), frozen = false, lastMapT = -1, lastMapAt = 0;
window.__done = false; window.__live = [];
const live = {};            // transmission id -> live result
const SPK_LABEL = { TWR: 'LGA TOWER', JAZZ646: 'JAZZ 646 · Air Canada Express 8646 · CRJ900', TRUCK1: 'TRUCK 1 · Rescue 35 · Port Authority ARFF' };
const SPK_COLOR = { TWR: '#39d0ff', JAZZ646: '#ffffff', TRUCK1: '#ffb13b' };
const T0 = 0, T1 = 150;     // timeline 23:35:00 → 23:37:30
const TL_EVENTS = [[7, 'landing clearance', '▲', '#39d0ff'], [124, 'crossing clearance', '▲', '#39d0ff'], [132, 'controller: “stop”', '▲', '#39d0ff'], [140, 'controller: “stop”', '▲', '#39d0ff'], [142, 'Truck 1 enters runway 4', '■', '#ff3b5c']];
const ARMS = [ // timeline key: arm file → label, symbol
  ['atc-nemotron-nano-30b-v1', 'GMAPS + Nemotron-30B LoRA (ours)', '★'],
  ['atc-qwen3-8b', 'GMAPS + Qwen3-8B LoRA (ours, live on this Spark)', '☆'],
  ['atc-nemotron-lightning-30b-v1', 'GMAPS + Lightning-30B LoRA (ours)', '☆'],
  ['qwen3-8b-base', 'GMAPS + off-the-shelf Qwen3-8B', '○'],
  ['nemotron-nano-30b-base', 'GMAPS + off-the-shelf Nemotron-30B', '○'],
  ['nemotron-lightning-30b-base', 'GMAPS + off-the-shelf Lightning-30B (hosted)', '○'],
  ['nemotron-lightning-3.5-30b-spark-base', 'GMAPS + off-the-shelf Lightning-30B (NVFP4, Spark)', '○']];

function wall(tt){ let s = 23*3600 + 35*60 + Math.floor(tt); const p = n => String(n).padStart(2,'0'); return `${p(Math.floor(s/3600)%24)}:${p(Math.floor(s/60)%60)}:${p(s%60)}`; }
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
function badge(spk){ return `<span class="badge s-${spk}">${SPK_LABEL[spk] || spk}</span>`; }
function wordingText(w){ return w && w.startsWith('as reported') ? `wording: ${w}` : 'wording: standard phraseology (reconstructed)'; }

// ---------- ledger logic in plain words (same rules as the page's ledger: ATCO clearances on runway 4) ----------
const norm = s => String(s || '').toLowerCase().trim();
const csRoot = s => norm(s).replace(/\s+and company$/, '');
function actionsOf(rec){ const c = (rec.commands || []).map(norm).join(' | '); const a = [];
  if (/cleared to land/.test(c)) a.push('CLEARED_TO_LAND');
  if (/request/.test(c)) a.push('REQUEST'); else if (/\bcross/.test(c)) a.push('CROSS_RUNWAY');
  if (/\bstop\b/.test(c)) a.push('STOP'); return a; }
function rwyOf(rec){ return [...(rec.values || []), ...(rec.commands || [])].some(v => /runway\s+four\b/.test(norm(v))) ? '4' : null; }
function ledgerKey(rec){ if (!rec || typeof rec !== 'object') return 'invalid';
  const a = actionsOf(rec).filter(x => x === 'CLEARED_TO_LAND' || x === 'CROSS_RUNWAY');
  return (rec.role === 'ATCO' && a.length) ? `${a.join('+')}|${rwyOf(rec)}|${csRoot((rec.callsigns || [])[0])}` : 'none'; }
function fieldChecks(out, gold){
  const eq = (a, b) => JSON.stringify((a || []).map(norm)) === JSON.stringify((b || []).map(norm));
  return [['role', out.role === gold.role], ['callsigns', eq(out.callsigns, gold.callsigns)], ['commands', eq(out.commands, gold.commands)], ['values', eq(out.values, gold.values)]];
}
function whyLine(x, out){
  const gold = x.parsed, ok = typeof out === 'object';
  if (!ok) return { cls: 'bad', text: '✗ output is not valid JSON → nothing enters the ledger' };
  const checks = fieldChecks(out, gold), allOk = checks.every(c => c[1]);
  const same = ledgerKey(out) === ledgerKey(gold);
  const acts = actionsOf(out), cs = (out.callsigns || [])[0], who = cs ? cs.toUpperCase() : '—';
  const rule = MODE === 'asis' ? ' (as-is: no rule runs)' : '';
  let effect;
  if (/\brequest\b/.test(x.text) && out.role !== 'ATCO') effect = `request from ${who} (${out.role}) → not an authorization; the ledger waits for the clearance`;
  else if (out.role === 'ATCO' && acts.includes('CLEARED_TO_LAND') && rwyOf(out)) effect = `“cleared to land” + “runway four” → CLEARED_TO_LAND, RWY 4, ${who} → runway 4 held for the landing${rule}`;
  else if (out.role === 'ATCO' && acts.includes('CROSS_RUNWAY') && rwyOf(out)) effect = `“cross” + “runway four” → CROSS_RUNWAY on RWY 4 at D, ${who} → checks against the active landing clearance${rule}`;
  else if (acts.includes('REQUEST') || /\brequest\b/.test(x.text)) effect = `request from ${who} (${out.role}) → not an authorization; the ledger waits for the clearance`;
  else if (out.role === 'PILOT') effect = `read-back by ${who} (PILOT) → no new authorization`;
  else if (acts.includes('STOP')) effect = `“stop” → STOP for ${(out.callsigns || []).map(s => s.toUpperCase()).join(', ') || '—'} → no runway-4 authorization added`;
  else effect = 'no runway instruction → no ledger change';
  if (allOk) return { cls: 'ok', text: '✓ ' + effect };
  const bad = checks.filter(c => !c[1]).map(c => c[0]);
  let diff = bad.map(f => f === 'role' ? `role read as ${out.role} (scripted ${gold.role})` : f === 'callsigns' ? `callsign ${JSON.stringify(out.callsigns)} vs ${JSON.stringify(gold.callsigns)}` : `${f} ${JSON.stringify(out[f])}`).join('; ');
  return same ? { cls: 'warn', text: `✗ ${diff} — same ledger record, no ledger effect · ${effect}` }
              : { cls: 'bad', text: `✗ ${diff} — changes what the ledger sees · ${effect}` };
}

// ---------- monitor ----------
const map = VIEW === 'monitor' ? new maplibregl.Map({ container: 'map', center: [-73.882, 40.771], zoom: 14.7, attributionControl: false,
  style: { version: 8, glyphs: 'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf', sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#070b16' } }] } }) : null;
async function boot(){
  scn = await fetch(SCN).then(r => r.json());
  try { stepped = await fetch('lga/stepped_in.json').then(r => r.json()); } catch (e) { stepped = {}; }
  if (FREEZE == null && scn.freeze) FREEZE = scn.freeze[MODE];
  if (VIEW === 'log') return bootLog();
  if (VIEW === 'spark') return bootSpark();
  geo = await fetch(scn.geo || 'klga.geojson').then(r => r.json());
  document.getElementById('hdr').textContent = `${scn.title} · ${scn.airport} · RWY ${scn.runway} · crossing at TWY ${scn.crossing_taxiway} · reconstruction, NTSB DCA26MA161 (preliminary)`;
  document.getElementById('rwy').textContent = scn.runway;
  const mt = document.getElementById('modetag'); mt.className = MODE; mt.textContent = MODE === 'asis' ? 'AS-IS · NO CROSS-CHECK' : 'WITH GMAPS';
  const narrow = window.innerWidth < 1700 && scn.center_v4_narrow;  // 1440×900 clips: map column is only ~660 px wide
  map.setCenter(narrow ? scn.center_v4_narrow : (scn.center_v4 || scn.center)); map.setZoom(narrow ? scn.zoom_v4_narrow : (scn.zoom_v4 || scn.zoom));  // v4 layout: strip on top, timeline at the bottom
  const kind = k => ({ type:'FeatureCollection', features: geo.features.filter(f => f.properties.kind === k) });
  map.addSource('tw', { type:'geojson', data: kind('taxiway') }); map.addSource('rw', { type:'geojson', data: kind('runway') }); map.addSource('hp', { type:'geojson', data: kind('holding_position') });
  map.addSource('active', { type:'geojson', data: { type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates: scn.runway_line } } });
  map.addSource('zone', { type:'geojson', data: { type:'Feature', properties:{}, geometry:{ type:'Point', coordinates: scn.intersection } } });
  map.addSource('holdpt', { type:'geojson', data: { type:'Feature', properties:{}, geometry:{ type:'Point', coordinates: scn.hold_point } } });
  map.addSource('ac', { type:'geojson', data: { type:'FeatureCollection', features: [] } });
  map.addLayer({ id:'tw', type:'line', source:'tw', paint:{ 'line-color':'#8a7a2a', 'line-width':['interpolate',['linear'],['zoom'],12,1,15,4], 'line-opacity':.8 } });
  map.addLayer({ id:'rw', type:'line', source:'rw', paint:{ 'line-color':'#5b6478', 'line-width':['interpolate',['linear'],['zoom'],12,4,15,16] } });
  map.addLayer({ id:'rw-center', type:'line', source:'rw', paint:{ 'line-color':'#c9d1e3', 'line-width':1, 'line-dasharray':[4,4] } });
  map.addLayer({ id:'active', type:'line', source:'active', paint:{ 'line-color':'#ff3b5c', 'line-width':['interpolate',['linear'],['zoom'],12,5,15,18], 'line-opacity':0 } });
  map.addLayer({ id:'hp', type:'circle', source:'hp', paint:{ 'circle-radius':3, 'circle-color':'#ffb13b', 'circle-opacity':.9 } });
  map.addLayer({ id:'holdpt', type:'circle', source:'holdpt', paint:{ 'circle-radius':6, 'circle-opacity':0, 'circle-stroke-color':'#ffb13b', 'circle-stroke-width':2 } });
  map.addLayer({ id:'tw-label', type:'symbol', source:'tw', layout:{ 'symbol-placement':'line', 'text-field':['get','ref'], 'text-size':11, 'text-font':['Open Sans Regular'] }, paint:{ 'text-color':'#c8b45a', 'text-halo-color':'#070b16', 'text-halo-width':1 } });
  map.addLayer({ id:'rw-label', type:'symbol', source:'rw', layout:{ 'symbol-placement':'line', 'text-field':['get','ref'], 'text-size':13, 'text-font':['Open Sans Regular'] }, paint:{ 'text-color':'#eef2ff', 'text-halo-color':'#070b16', 'text-halo-width':1.5 } });
  map.addLayer({ id:'zone', type:'circle', source:'zone', paint:{ 'circle-radius':20, 'circle-color':'#ff3b5c', 'circle-opacity':0, 'circle-stroke-color':'#ff3b5c', 'circle-stroke-width':2, 'circle-stroke-opacity':0 } });

    const ti = calls.reduce((s, c) => s + (c.tokens_in || 0), 0), to = calls.reduce((s, c) => s + (c.tokens_out || 0), 0); document.getElementById('sptok').textContent = `tokens in ${ti} · out ${to}`;
    const mx = Math.max(4000, ...calls.map(c => c.latency_ms));
    document.getElementById('spbars').innerHTML = calls.slice(-16).map(c => `<div><span style="width:210px;color:var(--dim)">:${c.port} ${c.model.slice(0, 22)}</span><span class="b" style="width:${(c.latency_ms / mx * 520).toFixed(0)}px;background:${c.port === 8001 ? '#76b900' : (c.port === 8002 ? '#39d0ff' : '#ffb13b')}"></span><span>${Math.round(c.latency_ms)} ms · ${c.tokens_in}→${c.tokens_out}</span></div>`).join('');
  };
  const pollG = () => fetch('/gpu').then(r => r.json()).then(j => { gpu = j; draw(); }).catch(() => {});
  const pollE = () => fetch('/endpoints').then(r => r.json()).then(eps => { document.getElementById('speps').innerHTML = eps.map(e => `<div class="ep"><span class="l" style="background:${e.up ? '#3ddc84' : '#ff3b5c'}"></span>:${e.port} · ${e.name} · ${e.up ? 'up' : 'down'}</div>`).join(''); }).catch(() => {});
  pollG(); pollE(); setInterval(pollG, 1000); setInterval(pollE, 3000);
  if (qs.get('load') === '1'){
    await new Promise(r => setTimeout(r, 2500));
    const lines = scn.variants.unresolved.transmissions;
    await Promise.all([8001, 8002, 8004].map(async port => { for (const x of lines){
      try { const j = await fetch('/parse_on', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ port, text: x.text, facility: x.facility }) }).then(r => r.json());
        if (!j.error){ calls.push(j); window.__live.push(j); draw(); } } catch (e) {} } }));
    setTimeout(() => window.__done = true, 2500);
  }
}
</script>
</body>
</html>
